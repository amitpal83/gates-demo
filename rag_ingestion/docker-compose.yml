# Local stack for the RAG PDF ingestion pipeline. See rag_ingestion/README.md for setup instructions.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/airflow
    # Airflow's REST API rejects basic auth by default (401) unless this is set.
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    MINIO_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    MINIO_SECURE: "false"
    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION: gates_rag_docs
    QDRANT_COLLECTION_DEV: gates_rag_docs_dev384
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    EMBEDDING_MODEL: text-embedding-3-large
    EMBEDDING_DIMENSIONS: "1024"
    LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY}
    AIRFLOW_API_URL: http://airflow-webserver:8080
    AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME}
    AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD}
    AIRFLOW_DAG_ID: rag_pdf_ingestion
    RAG_WEBHOOK_PORT: "8090"
    RAG_WEBHOOK_SHARED_SECRET: ${RAG_WEBHOOK_SHARED_SECRET}
    GATES_ENV: ${GATES_ENV:-development}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    PYTHONPATH: /opt/rag_ingestion_root
  volumes:
    # Repo root bind-mounted read-only so code edits don't need an image rebuild.
    - ..:/opt/rag_ingestion_root:ro
    - ./dags:/opt/airflow/dags:ro

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z  # Docker Hub denies anonymous pulls of this image; quay.io mirror works.
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # public on purpose -- PDFs get uploaded via the console/API from anywhere
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RAG_WEBHOOK_SHARED_SECRET: ${RAG_WEBHOOK_SHARED_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    # Bootstraps bucket/incoming prefix and the webhook notification target.
    command:
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio...";
          sleep 2;
        done &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        printf '' | mc pipe local/$$MINIO_BUCKET/incoming/.keep &&
        mc admin config set local notify_webhook:ragwebhook endpoint="http://rag-webhook:8090/minio-event" auth_token="$$RAG_WEBHOOK_SHARED_SECRET" &&
        mc --json admin service restart local &&
        sleep 5 &&
        mc event add local/$$MINIO_BUCKET arn:minio:sqs::ragwebhook:webhook --prefix incoming/ --suffix .pdf --event put || true

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"  # different host port than litellm's postgres

  airflow-init:
    <<: *airflow-common
    depends_on:
      - airflow-postgres
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username $$AIRFLOW_API_USERNAME --password $$AIRFLOW_API_PASSWORD --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      # service_started (the default) doesn't wait for db migrate to finish -- must be explicit.
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  rag-webhook:
    <<: *airflow-common
    depends_on:
      - minio
    # apache/airflow's default entrypoint runs `airflow <command>` -- override it to run uvicorn directly.
    entrypoint: ["/usr/bin/dumb-init", "--"]
    expose:
      - "8090"
    command: uvicorn rag_ingestion.webhook.app:app --host 0.0.0.0 --port 8090

  streamlit:
    build:
      context: ..
      dockerfile: rag_ingestion/docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: gates_rag_docs
      QDRANT_COLLECTION_DEV: gates_rag_docs_dev384
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: text-embedding-3-large
      EMBEDDING_DIMENSIONS: "1024"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      GATES_ENV: ${GATES_ENV:-development}
    depends_on:
      - qdrant

volumes:
  minio_data:
  qdrant_data:
  airflow_pgdata:
